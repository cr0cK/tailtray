name: Bug report
description: Something in Tailtray does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Tailtray menu
        2. Turn the switch off
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tailtray version
      description: Shown in the Tailtray preferences window.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: shell
    attributes:
      label: GNOME Shell version and distribution
      description: Output of `gnome-shell --version`, plus your distribution.
      placeholder: GNOME Shell 49.1, Fedora 43
    validations:
      required: true
  - type: input
    id: tailscale
    attributes:
      label: Tailscale version
      description: Output of `tailscale version`.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from `journalctl --user -b -o cat /usr/bin/gnome-shell | grep -i tailtray`.
      render: text
