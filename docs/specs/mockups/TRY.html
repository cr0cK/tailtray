<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRY — mockup</title>
<!--
  Spec mockup: one self-contained file, no build, no dependency.

  Each state of the UI is a <template data-state> below. The viewer lists them on the left, grouped
  by screen, renders the selected one on the right in an isolated frame, and keeps the selection in
  the URL (#/@<id>), so a link points at one state.

  Attributes of a state:
    id              the state's id, unique, such as SIGNIN-ERROR
    data-screen     the screen it belongs to; screens are listed in order of first appearance
    data-summary    a few words under the id in the list
    data-label      the title shown above the frame
    data-route      where the user is: a URL, a menu path, a window
    data-rules      the spec rules it shows, such as "Sign-in, Errors"
    data-kind       happy, edge, or error

  Interactive: any element with data-goto="<state id>" takes the viewer to that state when clicked,
  so the mockup can be walked through like the product. "Flow" outlines those elements.

  Product styles go in <style id="product">; they apply inside each frame only. Use the variables
  below so both themes work. When the project has a design system that can build to static HTML,
  compose the states from its real components instead of imitating them.
-->
<style id="product" media="not all">
  :root[data-theme="dark"] { --desk:#3d3846; --bar:#000; --barfg:#fff; --menu:#2e2e32; --hover:#ffffff17; --sub:#ffffff0a; --fg:#ffffffde; --dim:#ffffff8c; --sep:#ffffff1f; --accent:#3584e4; --ok:#33d17a; --warn:#f6d32d; --err:#ff7b63; --off:#ffffff40; --shadow:0 6px 24px #0009; --code:#ffffff14; --win:#242424; --card:#ffffff0f; }
  :root[data-theme="light"] { --desk:#c0bfbc; --bar:#000; --barfg:#fff; --menu:#fafafb; --hover:#0000000f; --sub:#00000008; --fg:#000000cc; --dim:#00000080; --sep:#0000001a; --accent:#3584e4; --ok:#26a269; --warn:#9c6e03; --err:#c01c28; --off:#00000033; --shadow:0 6px 24px #0004; --code:#0000000d; --win:#fafafa; --card:#ffffff; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--desk); color:var(--fg); font:14px/1.4 Cantarell, "Inter", system-ui, sans-serif; }
  .topbar { height:32px; background:var(--bar); color:var(--barfg); display:flex; align-items:center; padding:0 12px; font-size:13px; font-weight:700; }
  .topbar .clock { flex:1; text-align:center; }
  .topbar .tray { display:flex; gap:14px; align-items:center; }
  .topbar .ind { padding:4px 8px; border-radius:12px; display:flex; }
  .topbar .ind.open { background:#ffffff33; }
  .wrap { display:flex; justify-content:flex-end; padding:6px 70px 40px 12px; }
  .menu { width:380px; background:var(--menu); border-radius:14px; padding:6px; box-shadow:var(--shadow); }
  .it { display:flex; align-items:center; gap:10px; padding:7px 12px; border-radius:9px; min-height:34px; }
  .it[data-goto]:hover, .it.hov { background:var(--hover); }
  .it.ins { opacity:.45; }
  .grow { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .wrapline { white-space:normal; }
  .dim { color:var(--dim); } .sm { font-size:12px; } .b { font-weight:700; }
  .warn { color:var(--warn); } .err { color:var(--err); }
  .sep { height:1px; background:var(--sep); margin:5px 12px; }
  .sw { width:40px; height:22px; border-radius:11px; background:var(--off); position:relative; flex:none; }
  .sw::after { content:""; position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%; background:#fff; box-shadow:0 1px 2px #0004; }
  .sw.on { background:var(--accent); } .sw.on::after { left:21px; }
  .icon { opacity:.65; flex:none; width:16px; text-align:center; }
  .tick { width:16px; flex:none; }
  .sub { background:var(--sub); border-radius:9px; margin:2px 0; }
  .sub .it { padding-left:34px; }
  .dot { width:8px; height:8px; border-radius:50%; flex:none; background:var(--off); } .dot.on { background:var(--ok); }
  .badge { font-size:11px; padding:1px 7px; border-radius:8px; background:var(--code); color:var(--dim); flex:none; }
  .block { padding:6px 12px; font-size:13px; }
  code { font-family:"Source Code Pro", ui-monospace, monospace; font-size:12px; background:var(--code); padding:1px 5px; border-radius:4px; }
  .scroll { max-height:280px; overflow:auto; }
  .osd { position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:#000000d0; color:#fff; border-radius:18px; padding:14px 22px; display:flex; gap:12px; align-items:center; font-size:15px; }
  .banner { margin:10px auto 0; width:420px; background:var(--menu); border-radius:14px; box-shadow:var(--shadow); padding:12px 14px; display:flex; gap:12px; }
  .banner .t { font-weight:700; } .banner .meta { font-size:12px; color:var(--dim); }
  .win { margin:40px auto; width:560px; background:var(--win); border-radius:12px; box-shadow:var(--shadow); padding:0 0 24px; }
  .win .title { text-align:center; font-weight:700; padding:14px; }
  .group { margin:12px 24px; background:var(--card); border-radius:12px; }
  .row { display:flex; align-items:center; padding:12px 16px; gap:10px; border-top:1px solid var(--sep); }
  .row:first-child { border-top:0; }
  .drop { border:1px solid var(--sep); border-radius:8px; padding:4px 10px; font-size:13px; }
</style>
<style id="chrome">
  * { box-sizing: border-box; }
  :root { --c-bg:#0b1118; --c-panel:#111a24; --c-fg:#dbe4ec; --c-muted:#7d8d9c; --c-border:#223040; --c-accent:#14b8a6; }
  html, body { height: 100%; margin: 0; }
  body.viewer { display: flex; background: var(--c-bg); color: var(--c-fg); font: 13px/1.4 system-ui, sans-serif; }
  aside { width: 300px; flex-shrink: 0; display: flex; flex-direction: column; border-right: 1px solid var(--c-border); background: var(--c-panel); }
  aside .head { padding: 14px 16px; border-bottom: 1px solid var(--c-border); }
  aside .head h1 { font-size: 14px; margin: 0 0 4px; }
  aside .head p { margin: 0; color: var(--c-muted); font-size: 11px; }
  nav { flex: 1; overflow-y: auto; padding: 8px 0; }
  nav h2 { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--c-muted); margin: 12px 16px 4px; font-weight: 600; }
  nav .item { display: flex; align-items: center; }
  nav .state { flex: 1; min-width: 0; text-align: left; background: none; border: 1px solid transparent; color: var(--c-fg); padding: 6px 14px; cursor: pointer; }
  nav .state:hover { background: #ffffff0d; }
  nav .state[aria-current="true"] { border-color: var(--c-accent); background: #14b8a614; }
  nav .state[aria-current="true"] .id { color: var(--c-accent); }
  nav .id { display: block; font: 11px/1.4 ui-monospace, monospace; }
  nav .sum { display: block; color: var(--c-muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  nav .copy { opacity: 0; background: none; border: 0; color: var(--c-muted); cursor: pointer; padding: 4px 8px; }
  nav .item:hover .copy, nav .copy:focus-visible { opacity: 1; }
  main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--c-border); background: var(--c-panel); }
  header button { background: none; color: var(--c-fg); border: 1px solid var(--c-border); border-radius: 4px; padding: 4px 10px; cursor: pointer; font: inherit; }
  header button:disabled { opacity: .4; cursor: default; }
  header button[aria-pressed="true"] { background: var(--c-accent); border-color: var(--c-accent); color: #fff; }
  header .count { color: var(--c-muted); font-variant-numeric: tabular-nums; font-size: 11px; }
  header .title { flex: 1; min-width: 0; }
  header .title b { display: block; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .title span { display: block; color: var(--c-muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .kind { font-size: 10px; text-transform: uppercase; border: 1px solid var(--c-border); border-radius: 10px; padding: 2px 8px; color: var(--c-muted); }
  header .kind.error { color: #f05252; border-color: #f0525266; }
  header .kind.edge { color: #e3a008; border-color: #e3a00866; }
  iframe { flex: 1; border: 0; width: 100%; background: #fff; }
</style>
</head>

<template data-state id="PREFS" data-screen="Preferences" data-summary="Preferences window" data-label="Preferences" data-route="Extensions › Tailtray › Settings" data-rules="Preferences" data-kind="happy">
<div class="win"><div class="title">Tailtray</div><div class="group"><div class="row"><span class="grow">Refresh interval</span><span class="drop">10 seconds ⌄</span></div><div class="row"><span class="grow">Notifications</span><span class="sw on"></span></div></div><div class="group"><div class="row"><span class="grow">Version</span><span class="dim">0.1.0</span></div></div></div>
</template>

<!-- Viewer: no need to edit below. -->
<script>
(() => {
  const states = [...document.querySelectorAll('template[data-state]')];
  const screens = [...new Set(states.map((s) => s.dataset.screen))];
  const ordered = screens.flatMap((sc) => states.filter((s) => s.dataset.screen === sc));
  const productCss = document.getElementById('product').textContent;
  const code = document.title.split(' — ')[0];
  const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  let theme = 'dark', flow = false;
  const hashIndex = () => {
    let id = location.hash.slice(3);
    try { id = decodeURIComponent(id); } catch {}
    return ordered.findIndex((s) => location.hash.startsWith('#/@') && s.id === id);
  };
  let index = Math.max(0, hashIndex());

  document.body.className = 'viewer';
  document.body.insertAdjacentHTML('beforeend', `
    <aside><div class="head"><h1>${esc(code)} mockup</h1>
      <p>${ordered.length} states · ← → to browse · click a highlighted element in Flow to follow it</p></div>
      <nav></nav></aside>
    <main><header>
      <button data-act="prev">‹ Previous</button><button data-act="next">Next ›</button>
      <span class="count"></span>
      <div class="title"><b></b><span></span></div>
      <span class="kind"></span>
      <button data-act="flow" aria-pressed="false">Flow</button>
      <button data-act="dark" aria-pressed="true">Dark</button><button data-act="light" aria-pressed="false">Light</button>
    </header><iframe title="state"></iframe></main>`);
  const nav = document.querySelector('nav'), frame = document.querySelector('iframe');

  for (const sc of screens) {
    nav.insertAdjacentHTML('beforeend', `<h2>${esc(sc)}</h2>`);
    for (const s of ordered.filter((x) => x.dataset.screen === sc)) {
      const i = ordered.indexOf(s);
      nav.insertAdjacentHTML('beforeend', `<div class="item">
        <button class="state" data-i="${i}"><span class="id">${esc(s.id)}</span><span class="sum">${esc(s.dataset.summary)}</span></button>
        <button class="copy" title="Copy state id" data-copy="${esc(s.id)}">⧉</button></div>`);
    }
  }

  function render() {
    const s = ordered[index];
    history.replaceState(null, '', '#/@' + encodeURIComponent(s.id));
    nav.querySelectorAll('.state').forEach((b) => b.setAttribute('aria-current', String(+b.dataset.i === index)));
    nav.querySelector(`[data-i="${index}"]`).scrollIntoView({ block: 'nearest' });
    document.querySelector('.count').textContent = `${index + 1} / ${ordered.length}`;
    document.querySelector('.title b').textContent = s.dataset.label || s.id;
    document.querySelector('.title span').textContent =
      [s.dataset.screen, s.dataset.route, s.dataset.rules && 'rules: ' + s.dataset.rules].filter(Boolean).join(' · ');
    const kind = document.querySelector('.kind');
    kind.textContent = s.dataset.kind || ''; kind.className = 'kind ' + (s.dataset.kind || '');
    document.querySelector('[data-act=prev]').disabled = index === 0;
    document.querySelector('[data-act=next]').disabled = index === ordered.length - 1;
    for (const t of ['dark', 'light']) document.querySelector(`[data-act=${t}]`).setAttribute('aria-pressed', String(theme === t));
    document.querySelector('[data-act=flow]').setAttribute('aria-pressed', String(flow));
    frame.srcdoc = `<!DOCTYPE html><html data-theme="${theme}"><head><meta charset="utf-8"><style>${productCss}
      ${flow ? '[data-goto]{outline:2px dashed #f59e0b;outline-offset:2px}' : ''}[data-goto]{cursor:pointer}</style></head>
      <body>${s.innerHTML}<script>document.addEventListener('click',(e)=>{const t=e.target.closest('[data-goto]');
      if(t){e.preventDefault();parent.postMessage({mockupGoto:t.dataset.goto},'*');}});
      document.addEventListener('keydown',(e)=>{if(/^Arrow/.test(e.key)&&!e.target.closest('input,textarea,select,[contenteditable]')){
      e.preventDefault();parent.postMessage({mockupKey:e.key},'*');}});<\/script></body></html>`;
  }
  const go = (i) => { index = Math.min(ordered.length - 1, Math.max(0, i)); render(); };

  nav.addEventListener('click', (e) => {
    const c = e.target.closest('[data-copy]');
    if (c) return navigator.clipboard?.writeText(c.dataset.copy);
    const b = e.target.closest('.state'); if (b) go(+b.dataset.i);
  });
  document.querySelector('header').addEventListener('click', (e) => {
    const a = e.target.closest('[data-act]')?.dataset.act;
    if (a === 'prev') go(index - 1); else if (a === 'next') go(index + 1);
    else if (a === 'flow') { flow = !flow; render(); }
    else if (a === 'dark' || a === 'light') { theme = a; render(); }
  });
  const step = (key) => {
    if (key === 'ArrowRight' || key === 'ArrowDown') go(index + 1);
    if (key === 'ArrowLeft' || key === 'ArrowUp') go(index - 1);
  };
  addEventListener('keydown', (e) => { if (/^Arrow/.test(e.key)) { e.preventDefault(); step(e.key); } });
  addEventListener('message', (e) => {
    if (e.source !== frame.contentWindow || !e.data) return;
    if (e.data.mockupKey) return step(e.data.mockupKey);
    const id = e.data.mockupGoto; if (!id) return;
    const i = ordered.findIndex((s) => s.id === id);
    if (i < 0) console.warn('mockup: no state', id); else go(i);
  });
  addEventListener('hashchange', () => {
    const i = hashIndex(); if (i >= 0 && i !== index) go(i);
  });
  render();
})();
</script>
</body>
</html>
